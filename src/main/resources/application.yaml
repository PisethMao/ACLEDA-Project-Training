spring:
  application:
    name: student-management-api
  datasource:
    url: jdbc:postgresql://localhost:5432/student_management_db
    username: postgres
    password: ${DB_PASSWORD:Piseth1711*#}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
